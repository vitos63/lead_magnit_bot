services:
  db:
    image: postgres:17-alpine
    env_file: backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: backend/.env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8020:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
